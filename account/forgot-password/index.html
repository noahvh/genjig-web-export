<!DOCTYPE html>

    <title>Genjig password reset</title>
</head>
<body>
<h2>Reset password</h2>

<div id="msg"></div>

<form id="resetForm">
	<label for="email">Enter the email address associated with your account. A password reset link will be sent if the account exists.</label></br>
	<input type="email" id="email" placeholder="email address" required /></br>
    <button type="submit">Request reset</button>
</form>

<script>
