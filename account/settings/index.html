<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Genjig user settings</title>
</head>
<body>
<h2>Update user information</h2>

<div id="msg"></div></br>

<form id="updateForm">
	<label for="oldPassword">Enter your current password in order to update your account</label></br>
	<input type="password" id="oldPassword" placeholder="Current password" required minlength="6" maxlength="128" /></br>
	<label for="username">Change username. Allowed characters: A-Z, a-z, 0-9, ., _, -</label></br>
	<input type="text" id="username" placeholder="Username" minlength="3" maxlength="16" /></br>
	<label for="email">Change email. Won't be changed until visiting the verification link</label></br>
	<input type="email" id="email" placeholder="Email" /></br>
	<label for="newPassword">Change password. 6-128 characters</label></br>
    <input type="password" id="newPassword" placeholder="New Password" minlength="6" maxlength="128" /></br>
	<input type="password" id="confirmPassword" placeholder="Confirm Password" minlength="6" maxlength="128" /></br>
    <button type="submit">Update</button>
</form>

<script>
    const passwordRegex = /^.{6,128}$/;
	const usernameRegex = /^[A-Za-z0-9._-]{3,16}$/;
	
	console.log(window.location.href);

    const params = new URLSearchParams(window.location.search);
	const sessionJWT = params.get("t");
	
	window.history.replaceState({}, document.title, window.location.pathname);

    const msgBox = document.getElementById("msg");
	msgBox.textContent = "Fields left blank will not be changed";

    if (!sessionJWT) {
        msgBox.textContent = "Bad page, please try again";
		document.getElementById("updateForm").style.display = "none";
    }

    document.getElementById("updateForm").addEventListener("submit", async (e) => {
        e.preventDefault();

		const oldPassword = document.getElementById("oldPassword").value;
        const newPassword = document.getElementById("newPassword").value;
		const confirm = document.getElementById("confirmPassword").value;
		const username = document.getElementById("username").value;
		const email = document.getElementById("email").value;
		
		if (username && !usernameRegex.test(username)) {
			msgBox.textContent = "Username must be 3-16 characters; A-Z, a-z, 0-9, ., _, -";
			return;
		}

        if (newPassword && !passwordRegex.test(newPassword)) {
            msgBox.textContent = "Password must be between 6 and 128 characters.";
            return;
        }
		
		if (!(newPassword === confirm)) {
			msgBox.textContent = "Passwords do not match";
			return;
		}

        msgBox.textContent = "Submitting...";

        try {
			
			let body = {};
			
			body.oldPassword = oldPassword;
			
			if (username) {
				body.username = username;
			}
			if (email) {
				body.email = email;
			}
			if (newPassword) {
				body.password = newPassword;
			}
		
            const res = await fetch("https://api.genjig.com/v1/users/update", {
                method: "POST",
                headers: { 
					"Content-Type": "application/json",
					"Authorization": "Bearer " + sessionJWT
				},
                body: JSON.stringify(body)
            });
			
			if (!res.ok) {
				msgBox.textContent = "Server error: " + res.status;
				return;
			}

            const data = await res.json();

            if (data.error) {
                msgBox.textContent = data.error;
            } else {
                msgBox.textContent = "Done! Redirecting back to game...";
				setTimeout(() => {
					window.location.href = window.location.origin;
				}, 3000);
            }
        } catch (err) {
			console.log(err);
            msgBox.textContent = "An error occurred.";
        }
    });
</script>
</body>
</html>
